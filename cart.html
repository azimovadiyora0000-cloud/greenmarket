<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Savatcha — GreenMarket</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="container page-wrap">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Bosh sahifa</a></li>
          <li class="breadcrumb-item active">Savatcha</li>
        </ol>
      </nav>
      <div class="page-title">
        <span class="eyebrow">Xaridlaringiz</span>
        <h1>Savatcha va buyurtma</h1>
        <p>Mahsulotlarni tekshiring va buyurtmangizni rasmiylashtiring.</p>
      </div>
      <div class="row g-4">
        <div class="col-lg-7">
          <div class="surface p-3 p-md-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h4 mb-0">Savatchangiz</h2>
              <button
                class="btn btn-sm btn-outline-secondary"
                onclick="clearCart()"
              >
                Savatchani tozalash
              </button>
            </div>
            <div id="cart-items"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="surface p-4 summary-box">
            <h2 class="h4">Buyurtma xulosasi</h2>
            <div class="d-flex gap-2 my-3">
              <input
                id="promo-code"
                class="form-control"
                placeholder="Promokod"
              /><button class="btn btn-outline-green" onclick="applyPromo()">
                Kiritish
              </button>
            </div>
            <div id="promo-message" class="small mb-2"></div>
            <div class="summary-line">
              <span>Mahsulotlar summasi</span><b id="subtotal">0 so‘m</b>
            </div>
            <div class="summary-line">
              <span>Yetkazib berish</span><b id="delivery">15 000 so‘m</b>
            </div>
            <hr />
            <div class="summary-line total-line">
              <span>Jami</span><b id="total">15 000 so‘m</b>
            </div>
            <button class="btn btn-green w-100 mt-3" onclick="showCheckout()">
              Buyurtmani rasmiylashtirish
              <i class="bi bi-arrow-right"></i></button
            ><a href="products.html" class="btn btn-light w-100 mt-2"
              >Xaridni davom ettirish</a
            >
          </div>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="global-modals"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      renderCart();
    </script>
  </body>
</html>
