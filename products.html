<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mahsulotlar — GreenMarket</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>
    <main class="container page-wrap">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="index.html">Bosh sahifa</a></li>
          <li class="breadcrumb-item active">Mahsulotlar</li>
        </ol>
      </nav>
      <div class="page-title">
        <span class="eyebrow">GreenMarket katalogi</span>
        <h1>Barcha mahsulotlar</h1>
        <p>O‘zingizga kerakli mahsulotlarni toping va savatchaga qo‘shing.</p>
      </div>
      <div class="catalog-toolbar row g-3 align-items-center mb-4">
        <div class="col-lg-5">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span
            ><input
              id="product-search"
              class="form-control"
              placeholder="Mahsulot qidirish..."
            />
          </div>
        </div>
        <div class="col-lg-4">
          <select id="category-filter" class="form-select">
            <option value="">Barcha kategoriyalar</option>
            <option>Meva</option>
            <option>Sabzavot</option>
            <option>Sut</option>
            <option>Ichimlik</option>
            <option>Organik</option>
          </select>
        </div>
        <div class="col-lg-3">
          <select id="sort-products" class="form-select">
            <option value="default">Tartiblash: odatiy</option>
            <option value="low">Narx: arzondan qimmatga</option>
            <option value="high">Narx: qimmatdan arzonga</option>
          </select>
        </div>
      </div>
      <div class="row g-4" id="all-products"></div>
      <div class="text-center mt-4">
        <nav>
          <ul class="pagination justify-content-center">
            <li class="page-item active">
              <a class="page-link" href="#">1</a>
            </li>
            <li class="page-item">
              <a class="page-link" href="#" onclick="return false;">2</a>
            </li>
            <li class="page-item">
              <a class="page-link" href="#" onclick="return false;">3</a>
            </li>
          </ul>
        </nav>
      </div>
    </main>
    <div id="site-footer"></div>
    <div id="global-modals"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
      initCatalog();
    </script>
  </body>
</html>
